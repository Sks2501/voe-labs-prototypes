openapi: 3.0.3
info:
  title: Systems Lab Public Sandbox API
  version: 3.0.0
  description: |
    API pública, genérica, somente leitura e composta exclusivamente por dados sintéticos.
    Não representa empresa, marca, infraestrutura privada, dispositivos reais ou ambiente de produção.
servers:
  - url: https://sandbox.example.invalid/systems-lab
    description: Endpoint propositalmente não roteável

tags:
  - name: System
  - name: Resources
  - name: Telemetry

paths:
  /v1/status:
    get:
      tags: [System]
      operationId: getStatus
      summary: Retorna o estado lógico do sandbox
      responses:
        "200":
          description: Estado do ambiente sintético
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: Lista recursos sintéticos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ResourceStatus"
      responses:
        "200":
          description: Página de recursos sintéticos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/resources/{resourceId}:
    get:
      tags: [Resources]
      operationId: getResource
      summary: Consulta um recurso sintético
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Recurso encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/telemetry/events:
    get:
      tags: [Telemetry]
      operationId: listTelemetryEvents
      summary: Lista eventos sintéticos
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
            pattern: "^SYS-DEMO-[0-9]{2}$"
        - name: eventType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TelemetryEventType"
      responses:
        "200":
          description: Página de eventos sintéticos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  headers:
    RequestId:
      description: Identificador opaco de correlação.
      schema:
        type: string
        example: req_demo_000001

  parameters:
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        pattern: "^SYS-DEMO-[0-9]{2}$"
      example: SYS-DEMO-01
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Parâmetros inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Limite lógico excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StatusResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [service, environment, status, version]
          properties:
            service:
              type: string
              example: systems-lab-public-sandbox
            environment:
              type: string
              enum: [demonstration]
            status:
              type: string
              enum: [operational-demo]
            version:
              type: string
              example: 3.0.0
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ResourceStatus:
      type: string
      enum: [ready-demo, busy-demo, maintenance-demo, offline-demo]

    DemoResource:
      type: object
      required: [id, model, status, metricPercent, zone, lastEventAt]
      properties:
        id:
          type: string
          pattern: "^SYS-DEMO-[0-9]{2}$"
          example: SYS-DEMO-01
        model:
          type: string
          example: GENERIC-NODE-A
        status:
          $ref: "#/components/schemas/ResourceStatus"
        metricPercent:
          type: integer
          minimum: 0
          maximum: 100
          example: 84
        zone:
          type: string
          example: Zona Sintética A
        lastEventAt:
          type: string
          format: date-time

    ResourceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/DemoResource"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ResourceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DemoResource"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    TelemetryEventType:
      type: string
      enum: [heartbeat.demo, metric.sample.demo, position.sample.demo, state.sample.demo]

    TelemetryEvent:
      type: object
      required: [schema, eventId, eventType, sequence, resourceId, recordedAt, source, payload]
      properties:
        schema:
          type: string
          enum: [systems.lab.telemetry.demo.v1]
        eventId:
          type: string
          pattern: "^evt_demo_[0-9]{6}$"
        eventType:
          $ref: "#/components/schemas/TelemetryEventType"
        sequence:
          type: integer
          minimum: 0
        resourceId:
          type: string
          pattern: "^SYS-DEMO-[0-9]{2}$"
        recordedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [local-simulator]
        payload:
          type: object
          additionalProperties: true

    TelemetryListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryEvent"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    ResponseMeta:
      type: object
      required: [requestId, generatedAt, dataClassification]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time
        dataClassification:
          type: string
          enum: [synthetic-public-demo]

    PaginatedMeta:
      allOf:
        - $ref: "#/components/schemas/ResponseMeta"
        - type: object
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page:
              type: integer
              minimum: 1
            pageSize:
              type: integer
              minimum: 1
              maximum: 100
            totalItems:
              type: integer
              minimum: 0
            totalPages:
              type: integer
              minimum: 0

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT, NOT_FOUND, RATE_LIMITED, INTERNAL_DEMO_ERROR]
            message:
              type: string
            requestId:
              type: string
