<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Systems Lab · Dashboard Sintético</title>
  <style>
    :root{--accent:#38bdf8;--ink:#111827;--muted:#64748b;--bg:#f5f7fb;--card:#fff;--green:#22c55e}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:42px max(24px,7vw);background:linear-gradient(135deg,#111827,#263449);color:#fff}
    header b{color:var(--accent)}main{max-width:1120px;margin:-22px auto 60px;padding:0 20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
    .card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 12px 35px #0f172a12}
    .number{font-size:32px;font-weight:800;margin:8px 0}.muted{color:var(--muted);font-size:14px}
    table{width:100%;border-collapse:collapse}th,td{padding:15px;text-align:left;border-bottom:1px solid #e5e7eb}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:700}
    .metric{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.metric i{display:block;height:100%;background:var(--green)}
    footer{text-align:center;color:var(--muted);padding:24px}
  </style>
</head>
<body>
  <header><h1>Systems <b>Lab</b></h1><p>Dashboard técnico com dados exclusivamente sintéticos</p></header>
  <main>
    <section class="grid" id="metrics"></section>
    <section class="card" style="margin-top:16px;overflow:auto">
      <h2>Recursos demonstrativos</h2>
      <table><thead><tr><th>Recurso</th><th>Estado</th><th>Métrica</th><th>Zona</th></tr></thead><tbody id="resources"></tbody></table>
    </section>
  </main>
  <footer>Nenhuma empresa, usuário, endpoint, dispositivo ou infraestrutura real é utilizada.</footer>
  <script>
    const resources=[
      {id:"SYS-DEMO-01",status:"Pronto",metric:92,zone:"Zona Sintética A"},
      {id:"SYS-DEMO-02",status:"Pronto",metric:76,zone:"Zona Sintética B"},
      {id:"SYS-DEMO-03",status:"Inspeção",metric:48,zone:"Zona Sintética C"},
      {id:"SYS-DEMO-04",status:"Pronto",metric:83,zone:"Zona Sintética D"}
    ];
    const metrics=[
      ["Recursos fictícios",resources.length],
      ["Prontos",resources.filter(v=>v.status==="Pronto").length],
      ["Métrica média",Math.round(resources.reduce((a,v)=>a+v.metric,0)/resources.length)+"%"],
      ["Alertas simulados",1]
    ];
    document.querySelector("#metrics").innerHTML=metrics.map(([label,value])=>`<article class="card"><div class="muted">${label}</div><div class="number">${value}</div></article>`).join("");
    document.querySelector("#resources").innerHTML=resources.map(v=>`<tr><td><b>${v.id}</b></td><td><span class="pill">${v.status}</span></td><td><div>${v.metric}%</div><div class="metric"><i style="width:${v.metric}%"></i></div></td><td>${v.zone}</td></tr>`).join("");
  </script>
</body>
</html>
